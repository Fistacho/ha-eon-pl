name: E.ON Polska
version: "1.2.3"
slug: eon_pl
description: "Nieoficjalny scraper Mój E.ON (automatyzacja przeglądarki, nie jest to integracja API) do Home Assistant Energy Dashboard. Login email+hasło, MQTT auto-discovery, hourly statistics."
url: https://github.com/Fistacho/ha-eon-pl
arch:
  - aarch64
  - amd64
init: false
startup: services
hassio_api: true
homeassistant_api: true

services:
  - mqtt:want

options:
  email: ""
  password: ""
  scan_interval_hours: 6
  cookie_refresh_hours: 12
  selected_kus: []
  log_level: info
  mqtt_discovery: true
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  ha_token: ""
  capsolver_api_key: ""
  manual_cookie_only: false

schema:
  email: email
  password: password
  scan_interval_hours: int(1,24)
  cookie_refresh_hours: int(1,24)
  selected_kus:
    - str
  log_level: list(debug|info|warning|error)
  mqtt_discovery: bool
  mqtt_host: str?
  mqtt_port: int(1,65535)
  mqtt_user: str?
  mqtt_password: password?
  ha_token: password?
  capsolver_api_key: password?
  manual_cookie_only: bool

# Web UI wystawiony wyłącznie przez Ingress (autentykacja przez sesję HA).
# Brak jawnego `ports:` — endpoint /set_cookie w web_server.py nie ma własnej
# autoryzacji, więc publikowanie 8099 bezpośrednio na hosta pozwoliłoby każdemu
# w sieci LAN wstrzyknąć dowolne ciasteczko sesji E.ON bez logowania do HA.
# Domyślny ingress_port to 8099 (zgodnie z konwencją Supervisora), więc appka
# nasłuchująca na 0.0.0.0:8099 działa bez zmian w kodzie.
ingress: true
panel_icon: mdi:lightning-bolt-circle
panel_title: E.ON Polska
